[project]
name = "inferencemaxxing"
version = "0.1.0"
description = "YAML-driven quota-window calendar: ICS + Google Calendar + Telegram + web UI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Max Infeld"}]
dependencies = [
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.32"]
google = ["google-api-python-client>=2.150", "google-auth>=2.35"]

[project.scripts]
inferencemaxxing = "inferencemaxxing.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
